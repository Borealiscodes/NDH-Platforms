<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="1400" height="900" fill="none"/>

  <!-- Title -->
  <text x="700" y="80" font-family="Arial" font-size="36" fill="#6A6A6A" text-anchor="middle">
    NDH Expressive Suite Index v1.0
  </text>

  <!-- Traversal Ring Label -->
  <text x="700" y="150" font-family="Arial" font-size="28" fill="#6A6A6A" text-anchor="middle">
    Traversal Ring
  </text>

  <!-- Traversal Ring -->
  <ellipse cx="700" cy="450" rx="300" ry="180" fill="none" stroke="#CFC7FF" stroke-width="3"/>

  <!-- Traversal Nodes -->
  <circle cx="700" cy="300" r="28" fill="#D7E9FF"/>
  <text x="700" y="300" font-family="Arial" font-size="20" fill="#6A6A6A" text-anchor="middle" dy="6">
    Safety Envelope
  </text>

  <circle cx="900" cy="450" r="28" fill="#D7E9FF"/>
  <text x="900" y="450" font-family="Arial" font-size="20" fill="#6A6A6A" text-anchor="middle" dy="6">
    Orbital Rings
  </text>

  <circle cx="700" cy="600" r="28" fill="#D7E9FF"/>
  <text x="700" y="600" font-family="Arial" font-size="20" fill="#6A6A6A" text-anchor="middle" dy="6">
    Guardian Roles
  </text>

  <circle cx="500" cy="450" r="28" fill="#D7E9FF"/>
  <text x="500" y="450" font-family="Arial" font-size="20" fill="#6A6A6A" text-anchor="middle" dy="6">
    Trans-Orbital Flow
  </text>

  <!-- Public Ring Label -->
  <text x="700" y="720" font-family="Arial" font-size="28" fill="#6A6A6A" text-anchor="middle">
    Public Ring
  </text>

  <!-- Public Ring -->
  <ellipse cx="700" cy="450" rx="450" ry="260" fill="none" stroke="#DFF5D1" stroke-width="3"/>

  <!-- Public Nodes -->
  <circle cx="700" cy="180" r="28" fill="#DFF5D1"/>
  <text x="700" y="180" font-family="Arial" font-size="20" fill="#6A6A6A" text-anchor="middle" dy="6">
    Public Interaction Flow
  </text>

  <circle cx="1050" cy="450" r="28" fill="#DFF5D1"/>
  <text x="1050" y="450" font-family="Arial" font-size="20" fill="#6A6A6A" text-anchor="middle" dy="6">
    Soft Mistake Handling
  </text>

  <circle cx="700" cy="720" r="28" fill="#DFF5D1"/>
  <text x="700" y="720" font-family="Arial" font-size="20" fill="#6A6A6A" text-anchor="middle" dy="6">
    Habitat Map
  </text>

  <!-- Constellation Activation Node -->
  <circle cx="1200" cy="120" r="32" fill="#EDE7FF"/>
  <text x="1200" y="120" font-family="Arial" font-size="20" fill="#6A6A6A" text-anchor="middle" dy="6">
    Constellation Activation
  </text>

  <!-- Soft arcs connecting nodes (non-hierarchical) -->
  <path d="M700 300 C850 350 850 550 700 600" stroke="#CFC7FF" stroke-width="3" fill="none"/>
  <path d="M700 300 C550 350 550 550 700 600" stroke="#CFC7FF" stroke-width="3" fill="none"/>
  <path d="M900 450 C950 450 1000 450 1050 450" stroke="#DFF5D1" stroke-width="3" fill="none"/>
  <path d="M500 450 C450 450 400 450 350 450" stroke="#DFF5D1" stroke-width="3" fill="none"/>

</svg>

